{% extends "base.html" %}
{% block content %}
<div class="mx-auto max-w-md rounded-2xl border border-slate-200 bg-white p-6 shadow-sm">
  <h2 class="text-lg font-semibold text-slate-900">Changer mon mot de passe</h2>
  <form method="post" class="mt-5 space-y-4">{% csrf_token %}
    {% for field in form %}
    <label class="block text-sm text-slate-600">{{ field.label }}
      <input type="password" name="{{ field.html_name }}" required autocomplete="{% if forloop.first %}current-password{% else %}new-password{% endif %}" class="mt-1 block w-full rounded-lg border border-slate-300 px-3 py-2">
      {% for e in field.errors %}<span class="mt-1 block text-xs text-rose-600">{{ e }}</span>{% endfor %}
    </label>
    {% endfor %}
    <p class="text-xs text-slate-500">Au moins 8 caractères.</p>
    <button class="w-full rounded-lg bg-brand-600 px-4 py-2.5 text-sm font-semibold text-white hover:bg-brand-700">Enregistrer</button>
  </form>
</div>
{% endblock %}
